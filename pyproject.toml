[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mdp"
version = "10.1.0"
description = "Jev's contract rebuilt as a Markov decision process: typed, calibrated, schema-safe decisions with certificates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=7.4", "ruff>=0.4", "httpx>=0.27"]

[project.scripts]
jev = "jev.cli:main"

[tool.setuptools]
packages = ["jev"]

[tool.ruff]
line-length = 100
target-version = "py39"
